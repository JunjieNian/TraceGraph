[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegraph"
version = "0.1.1"
description = "Shared decision landscapes for analyzing and improving agent trajectories"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "tqdm>=4.65",
    "huggingface_hub>=0.16",
]

[project.optional-dependencies]
intervention = [
    "openai>=1.0",
    "datasets>=2.14",
]

[tool.setuptools.packages.find]
include = ["tracegraph*"]
